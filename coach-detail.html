<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>乐动平台 - 助教详情</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body data-page="coaches">
    <div class="demo-shell">
      <div class="phone">
        <div class="statusbar">
          <span>09:41</span>
          <span>上海</span>
          <span>5G</span>
        </div>
        <main class="page">
          <header class="page-head with-back">
            <button class="icon-btn" data-icon-button="back" aria-label="返回" data-back>返</button>
            <div class="page-title-wrap">
              <p class="eyebrow">Coach Detail</p>
              <h1>林夏</h1>
            </div>
          </header>

          <section class="card">
            <div class="profile-head">
              <div>
                <p class="meta-label">新手友好型助教</p>
                <h3 class="card-title">4.9 分 · 186 单</h3>
                <p>擅长陪打热场、规则讲解、基础击球和第一次来店陪同。</p>
              </div>
              <div class="avatar">夏</div>
            </div>
          </section>

          <section class="section">
            <div class="cover has-image">
              <img src="./assets/lamp.png" alt="助教服务现场图" />
              <div class="cover-inner">
                <div class="overlay-card">
                  <strong>服务风格：轻松、会带节奏</strong>
                  <p>重点帮助用户第一次来店不尴尬，也能快速进入打球状态</p>
                </div>
              </div>
            </div>
          </section>

          <section class="section">
            <div class="badge-row">
              <span class="pill green">陪练</span>
              <span class="pill green">教学</span>
              <span class="pill green">热场陪同</span>
              <span class="pill">驻场：星轨台球</span>
            </div>
          </section>

          <section class="section">
            <div class="price-grid">
              <div class="price-card">
                <p class="meta-label">陪打服务</p>
                <h3>¥99 / 小时</h3>
                <p>适合第一次来店，帮助热场和控节奏。</p>
              </div>
              <div class="price-card">
                <p class="meta-label">基础教学</p>
                <h3>¥128 / 小时</h3>
                <p>动作纠正、规则讲解和出杆稳定训练。</p>
              </div>
            </div>
          </section>

          <section class="section">
            <div class="section-head">
              <h2 class="section-title">可预约时间</h2>
            </div>
            <div class="times" data-chip-group>
              <button class="slot active">19:00</button>
              <button class="slot">20:00</button>
              <button class="slot">21:00</button>
              <button class="slot">22:00</button>
            </div>
          </section>

          <section class="section">
            <div class="review-list">
              <div class="review-card">
                <div class="review-score">
                  <h3>会员评价</h3>
                  <span class="pill gold">4.9</span>
                </div>
                <p>“第一次自己来打球完全不尴尬，会主动带话题，也会纠正动作，体验很好。”</p>
              </div>
            </div>
          </section>

          <section class="section section-stack">
            <a class="primary-btn" href="coach-booking.html">预约这位助教</a>
            <button class="secondary-btn" data-toast="已收藏到我的常用助教">先收藏</button>
          </section>
        </main>

        <nav class="tabbar">
          <a class="tab" data-tab="home" href="index.html">首页</a>
          <a class="tab" data-tab="venues" href="venues.html">场馆</a>
          <a class="tab" data-tab="buddies" href="buddies.html">搭子</a>
          <a class="tab" data-tab="coaches" href="coaches.html">助教</a>
          <a class="tab" data-tab="events" href="events.html">活动</a>
          <a class="tab" data-tab="profile" href="profile.html">我的</a>
        </nav>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="./app.js"></script>
  </body>
</html>
