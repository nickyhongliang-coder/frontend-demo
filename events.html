<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>乐动平台 - 活动</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body data-page="events">
    <div class="demo-shell">
      <div class="phone">
        <div class="statusbar">
          <span>09:41</span>
          <span>上海</span>
          <span>5G</span>
        </div>
        <main class="page">
          <header class="page-head">
            <div class="page-title-wrap">
              <p class="eyebrow">Events</p>
              <h1>官方活动</h1>
            </div>
          </header>

          <section class="section">
            <div class="chip-row" data-chip-group>
              <button class="chip active">全部</button>
              <button class="chip">破冰局</button>
              <button class="chip">积分赛</button>
              <button class="chip">户外局</button>
            </div>
          </section>

          <section class="section">
            <div class="list-stack">
              <a class="list-card" href="event-detail.html">
                <div class="cover has-image">
                  <img src="./team.png" alt="周五台球破冰夜活动图" />
                  <div class="cover-inner">
                    <div class="overlay-card">
                      <strong>周五台球破冰夜</strong>
                      <p>适合第一次来平台、第一次独自来店的用户</p>
                    </div>
                  </div>
                </div>
                <div class="info-row">
                  <span>今晚 19:30 · 星轨台球</span>
                  <span class="pill rose">剩余 8 位</span>
                </div>
              </a>

              <a class="list-card" href="event-detail.html">
                <div class="cover alt has-image">
                  <img src="./lounge.png" alt="双人积分挑战赛活动图" />
                  <div class="cover-inner">
                    <div class="overlay-card">
                      <strong>双人积分挑战赛</strong>
                      <p>更适合已经有一定基础的会员，兼具竞技和社交属性</p>
                    </div>
                  </div>
                </div>
                <div class="info-row">
                  <span>周六 15:00 · 黑曜会馆</span>
                  <span class="pill gold">报名中</span>
                </div>
              </a>
            </div>
          </section>
        </main>

        <nav class="tabbar">
          <a class="tab" data-tab="home" href="index.html">首页</a>
          <a class="tab" data-tab="venues" href="venues.html">场馆</a>
          <a class="tab" data-tab="buddies" href="buddies.html">搭子</a>
          <a class="tab" data-tab="coaches" href="coaches.html">助教</a>
          <a class="tab" data-tab="events" href="events.html">活动</a>
          <a class="tab" data-tab="profile" href="profile.html">我的</a>
        </nav>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="./app.js"></script>
  </body>
</html>
