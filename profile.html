<!DOCTYPE html>

  <body data-page="profile">
    <div class="demo-shell">
      <div class="phone">
        <main class="page">
          <header class="page-head">
            <div class="page-title-wrap">
              <p class="eyebrow">Profile</p>
              <h1>我的</h1>
            </div>

          <section class="card">
            <div class="profile-head">
              <div>
                <p class="meta-label">会员档案</p>
                <h3 class="card-title">梁业桥</h3>
                <p>偏好：台球 / 轻社交 / 新手进阶</p>
              </div>
              <div class="avatar">梁</div>
            </div>
          </section>

          <section class="section">
            <div class="profile-badge">
              <strong>VIP 会员</strong>
              <span>本月剩余免台费 2 小时 · 活动优先报名中</span>

              </div>
            </div>
          </section>

          <section class="section">
            <div class="list-stack">
              <a class="list-card" href="coach-apply.html">
                <div class="info-row">
                  <div>
                    <p class="meta-label">身份升级</p>
                    <h3>申请成为助教</h3>
                  </div>
                  <span class="pill gold">可申请</span>
                </div>
                <p>如果你本身会打球，也可以把会员身份升级为助教身份，开放自己的服务时间和价格。</p>
              </a>

              <div class="list-card">
                <div class="info-row">
                  <div>
                    <p class="meta-label">我的权益</p>
                    <h3>活动优先报名 + AI 优先推荐</h3>
                  </div>
                  <span class="pill green">已生效</span>
                </div>
                <p>会员权益会在订台、约助教和活动报名中直接生效。</p>
              </div>
